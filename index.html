<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de desejos</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-200 h-screen flex justify-center items-center">
    
    <div class="bg-white shadow-lg rounded-lg p-4">
        <h1 class="font-bold text-xl mb-6">Seja bem vindo(a)</h1>
        
        <form onsubmit="logar()" class="flex flex-col w-80">
            <Label for="email" class="uppercase text-sm font-bold mb-2 block">E-mail</Label>
            <input type="email" placeholder="email@gmail.com" required id="email" class="pl-3 h-10 border-2 border-slate-400 focus:border-purple-600 duration-150 rounded outline-none mb-4"/>

            <Label for="email" class="uppercase text-sm font-bold mb-2 block">Senha</Label>
            <input type="password" placeholder="********" required id="senha" class="pl-3 h-10 border-2 border-slate-400 focus:border-purple-600 duration-150 rounded outline-none mb-4"/>
            <a href="/cadastrar.html" class="my-8">Cadastre-se</a>

            <button class="w-full h-10 rounded bg-purple-600 hover:bg-purple-600 duration-200 hover:text-white font-bold">Logar</button>
        </form>
    </div>


    <script>

        function logar() {
            // corta fluxo natural do forms, já que naturalmente ele executaria o arquivo por causa do "action"
            event.preventDefault();

            let email = document.querySelector("#email").value;
            let senha = document.querySelector("#senha").value;

            let dados = {
                email,
                senha
            }


            fetch("https://js-lista-de-tarefas-api.onrender.com/login", {
                method: "post",
                headers: {
                    "Content-type": "application/json"
                },
                body: JSON.stringify(dados)
            })

                .then(resposta => resposta.json())
                .then(json => {
                    if (json.tipo == "warning") {
                        alert(json.mensagem);
                        return;
                    }

                    sessionStorage.setItem("usuario", JSON.stringify(json.usuario))
                    alert(json.mensagem);
                    window.location.href = "tarefas.html";
                })
                .catch(error => {
                    alert(error.message);
                })

            console.log(dados);
        }

    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de desejos</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    <header
        class="flex justify-between items-center py-4 px-15 bg-gradient-to-r from-purple-800 via-purple-500 to-purple-750">
        <input type="text" placeholder="Pesquisar" class="w-100 h-10 pl-4 rounded bg-white" />
        <button
            class="leading-10 bg-purple-800 rounded px font-bold text-white duration-200 cursor-pointer hover:bg-purple-400 hover:text-black">Nova
            tarefa</button>
    </header>

    <main class="p-15 bg-slate-200">
        <h1 class="text-3xl font-bold mb-6">Tarefas</h1>
        <div id="tarefas" class="grid grid-cols-3 gap-4">
            <div class="bg-white p-4 rounded-lg">
                <h3 class="font-bold mb-4">Título</h3>
                <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Eius inventore magnam quasi, minus enim
                    excepturi ea quis aperiam sequi obcaecati libero provident, quos explicabo distinctio atque sed in
                    odio quod.</p>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>

</html>

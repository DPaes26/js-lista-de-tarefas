<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de desejos</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
     <script src="https://unpkg.com/boxicons@2.1.4/dist/boxicons.js"></script>

</head>

<body>
    <header
        class="flex justify-between items-center py-4 px-15 bg-gradient-to-r from-purple-800 via-purple-500 to-purple-750">
        <input type="text" placeholder="Pesquisar" class="w-100 h-10 pl-4 rounded bg-white" />
        <button onclick="abrirFormCriar()"
            class="leading-10 bg-purple-800 rounded px font-bold text-white duration-200 cursor-pointer hover:bg-purple-400 hover:text-black">Nova
            tarefa</button>
    </header>

    <main class="p-15 bg-slate-200">
        <h1 class="text-3xl font-bold mb-6">Tarefas</h1>
        <div id="tarefas" class="grid grid-cols-3 gap-4"></div>

        <div id="overlay" class="w-full  h-screen bg-black/70 fixed top-0 left-0 opacity-0 invisible duration-150">
        </div>

        <div id="form-criar" 
            class="w-100 p-4 rounded-lg bg-white fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 opacity-0 invisible duration-200">
            <div class="flex justify-end delay-200">
                <box-icon name='x' onclick="fecharFormCriar()" class="cursor-pointer"></box-icon>
            </div>
            <form action="" onsubmit="criarTarefa()" class="flex flex-col">
                <label for="titulo" class="uppercase text-xs font-bold mb-2 block">Título</label>
                <input type="text" placeholder="Titulo da tarefa" id="titulo"
                    class="pl-3 h-10 border-2 border-slate-400 focus:border-purple-600 duration-150 rounded outline-none">

                <label for="descricao" class="uppercase text-xs font-bold mb-2 block">Descrição</label>
                <textarea id="descricao" class="pl-3 h-30 border-2 border-slate-400 focus:border-purple-600 duration-150 rounded  outline-none mb-4"></textarea>

                <button
                    class="w-full h-10 rounded bg-purple-600 hover:bg-purple-600 duration-200 hover:text-white font-bold">Criar</button>

            </form>
        </div>
    </main>
    <script src="script.js"></script>
    
</body>

</html>
